name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install --no-deps "harbor @ git+https://github.com/islo-labs/harbor-fork.git@121de2153c4bcdadd901beebd68cae4611ed0198"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        # ISLO_API_KEY is optional -- without it, integration tests are skipped
        # via the pytest.mark.skipif gate in tests/integration/.
        env:
          ISLO_API_KEY: ${{ secrets.ISLO_API_KEY }}
        run: pytest tests/ -v
