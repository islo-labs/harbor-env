name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        # ISLO_API_KEY is optional -- without it, integration tests are skipped
        # via the pytest.mark.skipif gate in tests/integration/.
        env:
          ISLO_API_KEY: ${{ secrets.ISLO_API_KEY }}
        run: pytest tests/ -v
