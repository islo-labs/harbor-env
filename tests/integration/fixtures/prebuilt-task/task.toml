version = "1.0"

[task]
name = "harbor-islo/prebuilt-live"
authors = []
keywords = []

[metadata]
difficulty = "easy"
category = "smoke"
tags = ["islo", "prebuilt", "live"]

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 120.0

[environment]
# Pre-built image -- IsloEnvironment skips the Dockerfile/compose paths and
# passes this directly to create_sandbox(image=...). python:3.13-slim mirrors
# what the unit tests use; it ships bash so `bash -lc` execs work.
docker_image = "python:3.13-slim"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 5120
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[solution.env]
